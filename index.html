<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veer Savarkar Boys School - 3D Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }

        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            margin: 50px auto;
            transform: perspective(1000px) rotateX(5deg);
            transition: all 0.5s ease;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .header:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-10px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.4);
        }

        .school-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            animation: logoFloat 4s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .school-logo:hover {
            transform: scale(1.1) rotateY(360deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px) rotateY(0deg); }
            50% { transform: translateY(-15px) rotateY(180deg); }
        }

        .header h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 15px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            transform: translateZ(20px);
        }

        /* 3D Cards Section */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
            margin: 60px 0;
            perspective: 1000px;
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card-3d::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, rgba(255, 107, 107, 0.1), rgba(78, 205, 196, 0.1));
            border-radius: 25px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card-3d:hover::before {
            opacity: 1;
        }

        .card-3d:hover {
            transform: translateY(-20px) rotateX(10deg) rotateY(5deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .card-3d:nth-child(even):hover {
            transform: translateY(-20px) rotateX(10deg) rotateY(-5deg);
        }

        .card-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .card-icon svg {
            width: 40px;
            height: 40px;
            color: white;
        }

        .card-3d h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: all 0.3s ease;
            transform: translateZ(10px);
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateZ(20px) translateX(10px);
        }

        .contact-item svg {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            color: #4ecdc4;
        }

        /* 3D Map Section */
        .map-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            margin: 60px auto;
            text-align: center;
            transform: perspective(1000px) rotateX(2deg);
            transition: all 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .map-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .map-section:hover {
            transform: perspective(1000px) rotateX(0deg) translateY(-15px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
        }

        .map-section h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .map-container {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
            position: relative;
        }

        .map-container:hover {
            transform: scale(1.02) rotateX(5deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .map-container iframe {
            width: 100%;
            height: 450px;
            border: none;
            transition: all 0.3s ease;
        }

        /* Interactive Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            opacity: 0.7;
            animation: particleFloat 8s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .cards-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            
            .card-3d {
                padding: 30px;
            }
            
            .map-container iframe {
                height: 300px;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 10px;
        }

        /* Loading Animation */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div id="three-container"></div>

    <div class="container">
        <div class="header">
            <div class="school-logo" onclick="createFireworks()">VS</div>
            <h1>Government Boys Senior Secondary School</h1>
            <p class="subtitle">Veer Savarkar Complex</p>
            <p class="subtitle">Karawal Nagar, Delhi</p>
        </div>

        <div class="cards-container">
            <div class="card-3d" onclick="cardInteraction(this)">
                <div class="card-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <h2>Administration</h2>
                <div class="contact-item">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span>HOS: Sh. Surendar Singh Khokhar</span>
                </div>
                <div class="contact-item">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                    <span>Contact: 9868936836</span>
                </div>
            </div>

            <div class="card-3d" onclick="cardInteraction(this)">
                <div class="card-icon">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                </div>
                <h2>School Info</h2>
                <div class="contact-item">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    <span>Karawal Nagar, Delhi</span>
                </div>
                <div class="contact-item">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                    </svg>
                    <span>Government School</span>
                </div>
            </div>
        </div>

        <div class="map-section">
            <h2>📍 Find Us Here</h2>
            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3498.8177840821468!2d77.27138501409875!3d28.72499108664318!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390cfff8cf603881%3A0xd66223db0a4f40f5!2sVeer%20Savarkar%20School!5e0!3m2!1sen!2sin!4v1656578281876!5m2!1sen!2sin"
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        // Three.js Scene Setup
        let scene, camera, renderer, stars = [], mouse = { x: 0, y: 0 };

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('three-container').appendChild(renderer.domElement);

            // Create floating 3D objects
            createFloatingObjects();
            createParticleSystem();
            
            camera.position.z = 5;
            animate3D();
        }

        function createFloatingObjects() {
            // Create floating geometric shapes
            const geometries = [
                new THREE.BoxGeometry(0.5, 0.5, 0.5),
                new THREE.SphereGeometry(0.3, 16, 16),
                new THREE.ConeGeometry(0.3, 0.6, 8),
                new THREE.OctahedronGeometry(0.4)
            ];

            const materials = [
                new THREE.MeshBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.6 }),
                new THREE.MeshBasicMaterial({ color: 0x4ecdc4, transparent: true, opacity: 0.6 }),
                new THREE.MeshBasicMaterial({ color: 0x45b7d1, transparent: true, opacity: 0.6 }),
                new THREE.MeshBasicMaterial({ color: 0x96ceb4, transparent: true, opacity: 0.6 })
            ];

            for (let i = 0; i < 15; i++) {
                const geometry = geometries[Math.floor(Math.random() * geometries.length)];
                const material = materials[Math.floor(Math.random() * materials.length)];
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.x = (Math.random() - 0.5) * 20;
                mesh.position.y = (Math.random() - 0.5) * 20;
                mesh.position.z = (Math.random() - 0.5) * 20;
                
                mesh.rotation.x = Math.random() * Math.PI;
                mesh.rotation.y = Math.random() * Math.PI;
                
                scene.add(mesh);
                stars.push(mesh);
            }
        }

        function createParticleSystem() {
            const particleCount = 200;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 50;
            }

            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                color: 0x4ecdc4,
                size: 0.1,
                transparent: true,
                opacity: 0.8
            });

            const particleSystem = new THREE.Points(particles, particleMaterial);
            scene.add(particleSystem);
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            // Rotate floating objects
            stars.forEach((star, index) => {
                star.rotation.x += 0.01 + index * 0.001;
                star.rotation.y += 0.01 + index * 0.001;
                star.position.y += Math.sin(Date.now() * 0.001 + index) * 0.01;
            });

            // Mouse interaction
            camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.02;
            camera.position.y += (-mouse.y * 0.5 - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // Mouse movement tracking
        document.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Card interaction
        function cardInteraction(card) {
            card.style.transform = 'translateY(-30px) rotateX(15deg) rotateY(10deg) scale(1.05)';
            setTimeout(() => {
                card.style.transform = 'translateY(-20px) rotateX(10deg) rotateY(5deg)';
            }, 300);
            
            // Create ripple effect
            createRipple(card);
        }

        function createRipple(element) {
            const ripple = document.createElement('div');
            ripple.style.position = 'absolute';
            ripple.style.width = '20px';
            ripple.style.height = '20px';
            ripple.style.background = 'rgba(78, 205, 196, 0.6)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'scale(0)';
            ripple.style.animation = 'rippleEffect 0.6s ease-out';
            ripple.style.left = '50%';
            ripple.style.top = '50%';
            ripple.style.marginLeft = '-10px';
            ripple.style.marginTop = '-10px';
            
            element.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        // Fireworks effect
        function createFireworks() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'particle';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.width = Math.random() * 8 + 4 + 'px';
                    firework.style.height = firework.style.width;
                    firework.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
                    firework.style.borderRadius = '50%';
                    firework.style.animationDuration = Math.random() * 3 + 2 + 's';
                    document.body.appendChild(firework);
                    
                    setTimeout(() => firework.remove(), 5000);
                }, i * 100);
            }
        }

        // Add ripple effect CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rippleEffect {
                to {
                    transform: scale(20);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize everything
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }, 1500);
            
            init3D();
        });

        // Add floating particles periodically
        setInterval(() => {
            if (Math.random() > 0.7) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 6 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = `hsl(${Math.random() * 60 + 180}, 70%, 60%)`;
                particle.style.borderRadius = '50%';
                particle.style.animationDuration = Math.random() * 4 + 4 + 's';
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 8000);
            }
        }, 2000);
    </script>
</body>
</html>
